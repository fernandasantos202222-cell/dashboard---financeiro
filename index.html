<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Financeiro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;padding:20px;background:#f5f5f5}
.card{background:white;padding:15px;border-radius:10px;margin:5px;display:inline-block;min-width:150px;box-shadow:0 2px 5px #0001}
h1{color:#333}
</style>
</head>
<body>
<h1>Dashboard Financeiro - Lavagem</h1>

<div class="card"><b>Faturamento</b><br>R$ 1.995,97</div>
<div class="card"><b>Custos</b><br>R$ 1.227,77</div>
<div class="card"><b>Lucro</b><br><span style="color:green">R$ 768,20</span></div>

<div style="background:white;padding:20px;border-radius:10px;margin-top:20px">
<canvas id="grafico"></canvas>
</div>

<script>
new Chart(document.getElementById('grafico'), {
 type: 'bar',
 data: {
   labels: ['Faturamento', 'Custos', 'Lucro'],
   datasets: [{
     label: 'Valores R$',
     data: [1995.97, 1227.77, 768.20],
     backgroundColor: ['#3b82f6','#ef4444','#22c55e']
   }]
 },
 options: { responsive: true }
});
</script>
</body>
</html>
